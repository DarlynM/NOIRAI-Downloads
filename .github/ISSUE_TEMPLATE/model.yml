name: Model compatibility report
description: Share a model result using synthetic prompts only.
body:
  - type: input
    id: model
    attributes:
      label: Public model URL, filename, and quantization
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NOIR version, Windows version, and hardware
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Chat works; coding check passes
        - Chat works; coding check fails
        - Model does not load
        - Download or import fails
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction steps and redacted error
      description: No private chats, files, credentials, or local server keys. A passing format check does not guarantee every coding task.
    validations:
      required: true
