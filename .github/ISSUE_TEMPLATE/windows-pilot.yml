name: Windows receiving-desk pilot
description: Share what happened with the two fictional delivery slips, or where setup stopped.
title: "[Windows pilot] "
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Use the [fictional receiving exercise](https://github.com/DarlynM/NOIRAI-Downloads/blob/main/Windows-Pilot.md). For a private reply, email social@noirgen.com. The app version, counts or setup step are enough.
  - type: dropdown
    id: outcome
    attributes:
      label: How far did you get?
      options:
        - I have not run it yet
        - Checked both deliveries
        - Checked the first delivery
        - Stopped during setup
        - Interested in trying this with a team
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Noir version and test PC, if available
      placeholder: "Noir version, RAM and optional GPU model"
  - type: textarea
    id: observation
    attributes:
      label: What happened?
      description: Share the missing and extra counts before and after the extra washer, the setup step that stopped you, or the workflow your team wants to try.
      placeholder: "First delivery ... Corrected delivery ... Or I stopped at ..."
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What would make the next run easier?
      placeholder: "One change that would help your team"
