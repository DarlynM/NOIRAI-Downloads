name: Report a reproducible problem
description: Use a synthetic example. This issue will be public.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve NOIR. Do not attach private conversations, project files, credentials, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: NOIR version
      placeholder: "Version shown in Settings"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and relevant hardware
      description: Include RAM and GPU model if relevant. Leave out device IDs and private paths.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model name and format
      placeholder: "Qwen 3 0.6B Q8_0, or none during setup"
  - type: textarea
    id: steps
    attributes:
      label: Steps with a synthetic example
      description: Explain how someone can reproduce this without your private files.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include only the relevant redacted error text, if any.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I checked that this report contains no private conversations, project contents, credentials, or sensitive paths.
          required: true
