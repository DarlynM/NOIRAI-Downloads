name: Public installer download counts
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-download-metrics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/collect-downloads.test.mjs
      - run: node .github/scripts/collect-downloads.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save aggregate observations only
        shell: bash
        run: |
          git config user.name 'NOIR Metrics'
          git config user.email 'noreply@users.noreply.github.com'
          git add -- metrics/
          if ! git diff --cached --quiet; then
            git commit -m 'Record public installer download counts'
            git push
          fi
